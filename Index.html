<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | North Star Bakery</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>North Star Bakery</h1>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <h2>Our Bakery Products</h2>
    <p>Browse our sample menu and save your favorite items.</p>
    <p>Sample prices only. No online checkout is available.</p>

    <label for="category">Choose a category:</label>
    <select id="category">
      <option value="all">All products</option>
      <option value="bread">Breads</option>
      <option value="pastry">Pastries</option>
      <option value="cake">Cakes</option>
      <option value="favorites">My favorites</option>
    </select>

    <p id="favorite-count" aria-live="polite"></p>
    <div id="product-list"></div>

    <p>
      <a href="contact.html">Ask about a product or pre-order</a>
    </p>

  <footer>
    <p>North Star Bakery — Student Website Project</p>
  </footer>
